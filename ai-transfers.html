<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Transfer Suggestions - FPL Stats</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="ai-transfers.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 AI Transfer Suggestions</h1>
            <nav class="nav-links">
                <a href="index.html">← Back to Stats</a>
            </nav>
            <div class="search-container">
                <label for="teamIdInput">Team ID:</label>
                <input type="number" id="teamIdInput" value="8668" placeholder="Enter Team ID" min="1">
                <button onclick="analyzeTeam()">Analyze Team</button>
            </div>
            <div class="team-name" id="teamName">Enter Team ID to start</div>
        </header>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Analyzing your team with AI...</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="content" style="display: none;">
            <!-- Team Budget Info -->
            <div class="stats-grid" id="budgetInfo"></div>

            <!-- Current Squad -->
            <div class="section">
                <h2>Your Current Squad</h2>
                <div id="currentSquad"></div>
            </div>

            <!-- AI Transfer Suggestions -->
            <div class="section ai-suggestions">
                <h2>🎯 AI Transfer Recommendations</h2>
                <div id="transferSuggestions"></div>
            </div>

            <!-- Players to Consider -->
            <div class="section">
                <h2>Top Players by Expected Points (Next 5 GWs)</h2>
                <div id="topPlayers"></div>
            </div>
        </div>
    </div>

    <footer>
        <p>Powered by <a href="https://jacek-flak.com" target="_blank" rel="noopener noreferrer">jSoft Jacek Flak</a></p>
    </footer>

    <button id="scrollToTop" class="scroll-to-top" title="Scroll to top">↑</button>

    <script src="ai-transfers.js"></script>
</body>
</html>
