<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Comparison - FPL Stats</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="players-comparison.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚖️ Compare Players</h1>
            <nav class="nav-links">
                <a href="index.html" style="color: #00ff87; text-decoration: none; font-size: 1.1em; font-weight: bold;">← Back to Stats</a>
            </nav>
            <div class="section-buttons">
                <a href="ai-team.html" class="section-btn" style="color: #00ff87; text-decoration: none;">🤖 AI Team</a>
            </div>
        </header>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Loading player data...</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="content" style="display: none;">
            <!-- Filters -->
            <div class="filters-section">
                <div class="filter-group">
                    <label for="positionFilter">Position:</label>
                    <select id="positionFilter" onchange="loadPlayers()">
                        <option value="1">🧤 GKP</option>
                        <option value="2">🛡️ DEF</option>
                        <option value="3" selected>⚽ MID</option>
                        <option value="4">🎯 FWD</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="gameweeksFilter">Compare for:</label>
                    <select id="gameweeksFilter" onchange="resetComparison()">
                        <option value="1">Next 1 GW</option>
                        <option value="3">Next 3 GWs</option>
                        <option value="5" selected>Next 5 GWs</option>
                    </select>
                </div>
            </div>

            <!-- Player Selection -->
            <div class="comparison-section">
                <div class="player-selector">
                    <label for="player1Search">🔍 Player 1:</label>
                    <input type="text" id="player1Search" class="player-search" placeholder="Search player..." oninput="filterPlayers(1)">
                    <label for="player1Select" style="display: none;">Select Player 1</label>
                    <select id="player1Select" class="player-list" size="10" onchange="selectPlayer(1)">
                        <option value="">Select player...</option>
                    </select>
                </div>

                <div class="vs-badge">VS</div>

                <div class="player-selector">
                    <label for="player2Search">🔍 Player 2:</label>
                    <input type="text" id="player2Search" class="player-search" placeholder="Search player..." oninput="filterPlayers(2)">
                    <label for="player2Select" style="display: none;">Select Player 2</label>
                    <select id="player2Select" class="player-list" size="10" onchange="selectPlayer(2)">
                        <option value="">Select player...</option>
                    </select>
                </div>
            </div>

            <button id="compareBtn" class="compare-button" onclick="comparePlayers()" style="display: none;">Compare</button>

            <!-- Results -->
            <div id="comparisonResult"></div>

            <!-- Chart -->
            <div id="comparisonChart" class="chart-container" style="display: none;">
                <div class="chart-header">
                    <h3>📊 Visual Comparison</h3>
                    <button class="fullscreen-btn" onclick="toggleFullscreen('comparisonChart')" title="Fullscreen">⛶</button>
                </div>
                <div class="chart-wrapper">
                    <canvas id="playerComparisonCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>Powered by <a href="https://jacek-flak.com" target="_blank" rel="noopener noreferrer">jSoft Jacek Flak</a></p>
        <p class="disclaimer">This website is an independent fan project.<br>
        It is not affiliated with or endorsed by the Premier League or any football club.</p>
    </footer>

    <button id="scrollToTop" class="scroll-to-top" title="Scroll to top">↑</button>

    <script src="xp-algorithm.js"></script>
    <script src="players-comparison.js"></script>
</body>
</html>
